<main>
    <div class="routeContainer">
        @if (showOnlyMap) { <!-- Kunde ist Driver -->
            <div class="left-container">
                <app-map class="map" />
            </div>
        } @else if (geoService.showInput.getValue()) { <!-- Wenn Fahrer -->
            <div class="left-container">
                <app-route-input class="routeInput" />
            </div>
            <div class="right-container">
                <app-map class="map" />
            </div>
        } @else if (!geoService.showInput.getValue() && !geoService.isSubmitted.getValue()) { <!-- User hat Koordinaten eingegeben und noch nicht bestätigt -->
            <div class="left-container">
                <app-ride-request-summary class="rideRequestSummary" />
            </div>
            <div class="right-container">
                <app-map class="map" />
            </div>
        } @else { <!-- User hat die Fahrt bestätigt -->
            <div class="left-container">
                <app-rideoffers class="rideRequestOffers"/>
            </div>
            <div class="right-container">
                <div class="right-container-splitted">
                    <app-ride-request-summary class="rideRequestSummary" />
                    <app-map class="map" />
                </div>
            </div>
        }
    </div>
</main>
