<main>
    <div class="routeContainer">
        @if (!showOnlyMap) {
          @if (geoService.showInput.getValue()) {
              <app-route-input class="routeInput" />
          } @else {
              <app-ride-request-summary class="rideRequestSummary" />
          }
        } @else {
          <app-ride-request-list class="rideRequestList"/>
        }
        <app-map class="map" />
    </div>
</main>
