<main>
  @if (rideSimulationStore.rideData.getValue().completed) {
    <div class="modal">
      <div class="content">
        <div class="headline">
          <p>Bewerten</p>
        </div>
        <div class="main">
          <i [className]="rating > 0 ? 'fas fa-star' : 'far fa-star'" (click)="setRating(1)"></i>
          <i [className]="rating > 1 ? 'fas fa-star' : 'far fa-star'" (click)="setRating(2)"></i>
          <i [className]="rating > 2 ? 'fas fa-star' : 'far fa-star'" (click)="setRating(3)"></i>
          <i [className]="rating > 3 ? 'fas fa-star' : 'far fa-star'" (click)="setRating(4)"></i>
          <i [className]="rating > 4 ? 'fas fa-star' : 'far fa-star'" (click)="setRating(5)"></i>
        </div>
        <div class="footer">
          <div class="buttonRow">
            <div class="buttonContainer">
              <button class="cancelBtn" (click)="submit(null)">
                Nicht bewerten
              </button>
            </div>
            <div class="buttonContainer">
              <button class="continueBtn" (click)="submit(rating)">
                Weiter
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
  <div class="routeContainer">
    <app-ride-simulation class="leftSide" />
    <app-map class="map" />
  </div>
</main>
