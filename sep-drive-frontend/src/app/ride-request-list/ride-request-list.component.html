<form [formGroup]="routeForm" class="routeInputForm">
  <div *ngIf="!useStartCoordinates; else coordinatesInput" class="inputRow">
    <button class="imageButton" type="button" (click)="useStartCoordinates = !useStartCoordinates">
      <i class="fa-solid fa-pencil"></i>
    </button>
    <div class="textInputContainer">
      <input
        type="text"
        id="route-start"
        formControlName="start"
        placeholder="Start"
        class="textInput"
        (blur)="onStartBlur()"
        (focus)="onStartFocus()"
      />
      <button type="button" class="imageButton" (click)="getLocation()">
        <i class="fa-solid fa-location-dot"></i>
      </button>
    </div>
    <ul *ngIf="startShowSuggestions && startSuggestions.length > 0" class="startSuggestions">
      <li *ngFor="let suggestion of startSuggestions" (mousedown)="onStartSelect(suggestion)">
        {{ suggestion.properties.label }}
      </li>
    </ul>
  </div>

  <ng-template #coordinatesInput>
    <div class="inputRow">
      <button class="imageButton" type="button" (click)="useStartCoordinates = !useStartCoordinates">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <div class="textInputContainer">
        <input
          type="number"
          id="startLon"
          formControlName="startCordLon"
          placeholder="50.000000"
          class="textInput"
        />
      </div>
      <div class="textInputContainer">
        <input
          type="number"
          id="startLat"
          formControlName="startCordLat"
          placeholder="50.000000"
          class="textInput"
        />
      </div>
      <button class="imageButton" type="button" (click)="checkCoordinates()">
        <i class="fa-solid fa-check"></i>
      </button>
    </div>
  </ng-template>

</form>
  <div class="table_container">
    <table mat-table [dataSource]="dataSource" matSort class="ride-request-table">

      <!-- Header-Zeile -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="table_header"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Spalte: Fahrt ID -->
      <ng-container matColumnDef="fahrtid" class="fahrtid_column">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Fahrt ID </th>
        <td mat-cell *matCellDef="let element">{{ element.fahrtid }}</td>
      </ng-container>

      <!-- Spalte: Zeitpunkt -->
      <ng-container matColumnDef="zeitpunkt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Zeitpunkt </th>
        <td mat-cell *matCellDef="let element">{{ element.zeitpunkt | date:'short' }}</td>
      </ng-container>

      <!-- Spalte: Entferung -->
      <ng-container matColumnDef="entfernung">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Entfernung </th>
        <td mat-cell *matCellDef="let element"> {{ element.entfernung }} km</td>
      </ng-container>

      <!-- Spalte: Bewertung -->
      <ng-container matColumnDef="bewertung">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Bewertung </th>
        <td mat-cell *matCellDef="let element"> <div class="stars">
          <ng-container *ngFor="let star of [1,2,3,4,5]">
            <i [class]="getStarClass(element.bewertung, star)"></i>
          </ng-container>
        </div></td>
      </ng-container>

      <!-- Spalte: Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
      </ng-container>

      <!-- Spalte: Klasse -->
      <ng-container matColumnDef="klasse">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Klasse </th>
        <td mat-cell *matCellDef="let element"> {{ element.klasse }}</td>
      </ng-container>

      <!-- Spalte: Annehmen -->
      <ng-container matColumnDef="annehmen">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element">
          <button mat-button class="annehmen-btn">Annehmen</button>
        </td>
      </ng-container>
    </table>
  </div>
