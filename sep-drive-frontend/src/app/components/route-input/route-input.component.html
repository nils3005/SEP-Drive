<form [formGroup]="routeForm" (ngSubmit)="onSubmit()" class="routeInputForm">
    <app-location-input placeholder="Start" [showGpsLocationButton]="true" (onLocationSelected)="onStartSelect($event)" [location]="this.geoStoreService.start.getValue()"/>
    @if (showStopInput) {
      <app-location-stop-input (onStopsChange)="onStopChange($event)"/>
    } @else {
      <div class="inputRow">
        <i class="fa-solid fa-plus" (click)="showStopInput = !showStopInput"></i>
      </div>
    }
    <app-location-input placeholder="Ziel" (onLocationSelected)="onDestinationSelect($event)" [location]="geoStoreService.destination.getValue()"/>
    <div class="textInputContainer">
        <select name="car-type" id="carType" formControlName="carType" class="textInput">
            <option value="" disabled selected hidden>Autotyp</option>
            @for (carType of carTypes; track carType.id) {
                <option [value]="carType.value">{{carType.value}}</option>
            }
        </select>
    </div>
    <input type="submit" value="Bestätigen" class="buttonPrimary">
</form>
