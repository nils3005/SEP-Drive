<div class="grid grid-cols-3 grid-rows-1 gap-1 mt-15 font-sans" xmlns="http://www.w3.org/1999/html">
  <p></p>
  <div *ngIf="auth.isLoggedIn()">
    <div>
      <span class="text-[#914141] text-2xl mb-2 flex ">
        Zahlungsmethode hinzufügen
      </span>
    </div>
    <div *ngIf="user()?.role === 'CUSTOMER'">
      <div >
        <form class="flex flex-col" #paymentMethodCustomer="ngForm" (ngSubmit)="onSubmit()">
          <label for="firstName">Vorname<span class="text-red-600">*</span> </label>
          <input class="form-control bg-gray-200 mb-2 h-8 rounded" #firstName="ngModel" [(ngModel)]="paymentMethodCustomerData.firstName"
                 type="text"
                 id="firstName"
                 name="firstName"
                 placeholder="Vorname"
                 required>
          <label for="lastName">Nachname<span class="text-red-600">*</span></label>
          <input class="form-control bg-gray-200 mb-2 h-8 rounded" #lastName="ngModel" [(ngModel)]="paymentMethodCustomerData.lastName"
                 type="text"
                 id="lastName"
                 name="lastName"
                 placeholder="Nachname"
                 required>
          <label for="cardNumber">Kreditkartennummer<span class="text-red-600">*</span></label>
          <input class="form-control bg-gray-200 mb-2 h-8 rounded" #cardNumber="ngModel" [(ngModel)]="paymentMethodCustomerData.creditCardNumber"
                 type="text"
                 id="cardNumber"
                 name="cardNumber"
                 placeholder="Kreditkartennummer"
                 pattern="^[0-9]{16}$"
                 required>
          <label for="expiryDate">Ablaufdatum (JJJJ-MM)<span class="text-red-600">*</span></label>
          <input class="form-control bg-gray-200 mb-2 h-8 rounded"
                 type="month"
                 id="expiryDate"
                 name="expiryDate"
                 [(ngModel)]="paymentMethodCustomerData.expiryDate"
                 required>
          <label for="cvc">Kartenprüfnummer (CVC)<span class="text-red-600">*</span></label>
          <input class="form-control bg-gray-200 mb-2 h-8 rounded"
                 type="text"
                 id="cvc"
                 name="cvc"
                 maxlength="3"
                 minlength="3"
                 pattern="^[0-9]{3,4}$"
                 [(ngModel)]="paymentMethodCustomerData.cvc"
                 required>
          <button [disabled]="paymentMethodCustomer.invalid" class="btn btn-info bg-[#914141] text-white hover:bg-[#733C3C] rounded h-8
                disabled:bg-gray-400 disabled:text-black disabled:cursor-not-allowed"
                  type="submit">Submit
          </button>
          <div>
            <span class="text-red-600">*</span>
            <span>Pflichtfeld</span>
          </div>


        </form>
      </div>
      </div>
    <div *ngIf="user()?.role === 'DRIVER'">
      <div>
        <form class="flex flex-col" #paymentMethodDriver="ngForm" (ngSubmit)="onSubmit()">
          <label for="firstName">Vorname<span class="text-red-600">*</span> </label>
          <input class="form-control bg-gray-200 mb-2 h-8 rounded" #firstName="ngModel" [(ngModel)]="paymentMethodDriverData.firstName"
                 type="text"
                 id="firstName"
                 name="firstName"
                 placeholder="Vorname"
                 required>
          <label for="lastName">Nachname<span class="text-red-600">*</span></label>
          <input class="form-control bg-gray-200 mb-2 h-8 rounded" #lastName="ngModel" [(ngModel)]="paymentMethodDriverData.lastName"
                 type="text"
                 id="lastName"
                 name="lastName"
                 placeholder="Nachname"
                 required>
          <label for="iban">IBAN<span class="text-red-600">*</span></label>
          <input class="form-control bg-gray-200 mb-2 h-8 rounded" #iban="ngModel" [(ngModel)]="paymentMethodDriverData.iban"
                 type="text"
                 id="iban"
                 name="iban"
                 placeholder="IBAN"
                 maxlength="34"
                 pattern="^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$"
                 required>
          <button [disabled]="paymentMethodDriver.invalid" class="btn btn-info bg-[#914141] text-white hover:bg-[#733C3C] rounded h-8
                disabled:bg-gray-400 disabled:text-black disabled:cursor-not-allowed"
                  type="submit">Submit
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
