<style>
  @import url('https://fonts.cdnfonts.com/css/glory');
</style>
<link href="https://fonts.cdnfonts.com/css/glory" rel="stylesheet">
<div class="main">
<div class="login_container">
  <div class="welcome_message">
    <h1>Willkommen zurück, {{ username }}!</h1>
  </div>
  <input #passwordInput id="password" type="password" (keydown.enter)="onSignIn()" [(ngModel)]="password" placeholder="Passwort"  autofocus>
  <div class="error">
    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  </div>
  <div class="sign_in"></div>
  <button (click)="onSignIn()" id="sign_in_button">Sign in</button>
 </div>
</div>
