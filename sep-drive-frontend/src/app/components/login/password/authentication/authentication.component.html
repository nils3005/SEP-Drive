<style>
  @import url('https://fonts.cdnfonts.com/css/glory');
</style>
<link href="https://fonts.cdnfonts.com/css/glory" rel="stylesheet">
<div class="main">
<div class="login_container">
  <div class="welcome_message">
    <h1>Willkommen zurück, {{ username }}!</h1>
  </div>
  <div id="input_code">
    <input id="code" type="text" (keydown.enter)="onVerify()" [maxlength]="4" [(ngModel)]="code">
  </div>
  <div class="message">
    <p *ngIf="errorMessage" class="errorMessage">{{ errorMessage }}</p>
    <p *ngIf="resendMessage" class="errorMessage">{{ resendMessage }}</p>
  </div>
  <div class="tip">
    <p>Tipp: Überprüfe deinen Posteingang und deinen Spam-Ordner</p>
  </div>
  <div class="resend">
   <button id="resend" (click)="onResend()">Code erneut versenden</button>
  </div>
  <div class="supercode">
    <button id="supercode" (click)="toSuperCode()">Stadtdessen Super-Code eingeben</button>
  </div>
  <div class="button_group">
    <button id="back" (click)="toPassword()"><i class="fa-solid fa-arrow-left" style="color: #000000;"></i></button>
    <button id="continue" (click)="onVerify()">Weiter</button>
    </div>
  </div>
</div>
