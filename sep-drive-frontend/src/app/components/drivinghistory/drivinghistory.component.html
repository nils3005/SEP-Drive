<div class="mt-15 font-sans" xmlns="http://www.w3.org/1999/html">
  <div class="w-full flex justify-center">
    <input
      type="text"
      placeholder="Name"
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)"
      class="search-input border border-gray-500 px-4 py-2 w-[500px] rounded-xl"
    />
  </div>
  <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)"
         class="mat-elevation-z8 !mt-5 ">

    <ng-container matColumnDef="historyId">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let fahrt">{{ fahrt.historyId }}</td>
    </ng-container>

    <ng-container matColumnDef="finishDate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Beendet</th>
      <td mat-cell *matCellDef="let fahrt">{{ fahrt.finishDate }}</td>
    </ng-container>

    <ng-container matColumnDef="drivenDistance">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Distanz</th>
      <td mat-cell *matCellDef="let fahrt">{{ fahrt.drivenDistance }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Preis</th>
      <td mat-cell *matCellDef="let fahrt">{{ fahrt.price }}</td>
    </ng-container>

    <ng-container matColumnDef="drivenTime">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Zeit</th>
      <td mat-cell *matCellDef="let fahrt">{{ fahrt.drivenTime }}</td>
    </ng-container>

    <ng-container matColumnDef="ratingCustomer">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Bewertung Beifahrer</th>
      <td mat-cell *matCellDef="let fahrt">
        <mat-icon *ngFor="let star of getStars(fahrt.ratingCustomer)">{{ star }}</mat-icon>
      </td>

    </ng-container>

    <ng-container matColumnDef="ratingDriver">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Bewertung Fahrer</th>
      <td mat-cell *matCellDef="let fahrt">
        <mat-icon *ngFor="let star of getStars(fahrt.ratingDriver)">{{ star }}</mat-icon>
      </td>
    </ng-container>

    <ng-container matColumnDef="customer">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Beifahrer</th>
      <td mat-cell *matCellDef="let fahrt">{{ fahrt.customer }}</td>
    </ng-container>

    <ng-container matColumnDef="driver">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Fahrer</th>
      <td mat-cell *matCellDef="let fahrt">{{ fahrt.driver }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="!bg-[#dbabab]"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
</div>
