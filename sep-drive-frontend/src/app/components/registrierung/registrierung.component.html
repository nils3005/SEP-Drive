<div class="grid grid-cols-3 grid-rows-1 gap-1 mt-15 font-sans" xmlns="http://www.w3.org/1999/html">
  <div class="col-start-2">
    <span class="text-[#914141] text-2xl flex">
      Registrierung
  </span>
    <form class="flex flex-col" #registrierungsform="ngForm" (ngSubmit)="onSubmit()">
      <label for="username">Benutzername<span class="text-red-600">*</span> </label>
      <input class="form-control bg-gray-200 mb-1 h-8 rounded" #username="ngModel" [(ngModel)]="registrierungsUser.username"
             type="text"
             id="username"
             name="username"
             placeholder="Benutzername"
             required>
      <label for="firstname">Vorname<span class="text-red-600">*</span></label>
      <input class="form-control bg-gray-200 mb-1 h-8 rounded" #firstName="ngModel" [(ngModel)]="registrierungsUser.firstName"
             type="text"
             name="firstname"
             id="firstname"
             placeholder="Vorname"
             required>
      <label for="lastname">Nachname<span class="text-red-600">*</span></label>
      <input class="form-control bg-gray-200 mb-1 h-8 rounded" #lastName="ngModel" [(ngModel)]="registrierungsUser.lastName"
             type="text"
             id="lastname"
             name="lastname"
             placeholder="Nachname"
             required>
      <label for="email">E-Mail<span class="text-red-600">*</span></label>
      <input class="form-control bg-gray-200 mb-1 h-8 rounded" #email="ngModel" [(ngModel)]="registrierungsUser.email"
             type="email"
             id="email"
             name="email"
             placeholder="E-Mail"
             required>
      <label for="rolle">Rolle<span class="text-red-600">*</span></label>
      <select class="form-control bg-gray-200 mb-1 h-8 rounded " #rolle="ngModel" [(ngModel)]="registrierungsUser.rolle" id="rolle" name="rolle" required>
        <option disabled selected value hidden> Rolle </option>
        <option value="DRIVER">Fahrer</option>
        <option value="CUSTOMER">Beifahrer</option>
      </select>

        <label *ngIf="rolle.value === 'DRIVER'" for="carType">Fahrzeug<span class="text-red-600">*</span></label> <br>
        <select *ngIf="rolle.value === 'DRIVER'" class="form-control bg-gray-200 mb-1 h-8 rounded " #carType="ngModel" [(ngModel)]="registrierungsUser.carType" id="carType" name="carType" required>
          <option disabled selected value hidden> Fahrzeug </option>
          <option value="SMALL">Small</option>
          <option value="MEDIUM">Medium</option>
          <option value="DELUXE">Deluxe</option>
        </select>

      <label for="birthDate">Geburtsdatum<span class="text-red-600">*</span></label>
      <input class="form-control bg-gray-200 mb-1 h-8 rounded" #birthDate="ngModel" [(ngModel)]="registrierungsUser.birthDate"
             type="date"
             id="birthDate"
             name="birthDate"
             required>

      <label for="password">Passwort<span class="text-red-600">*</span></label>
      <input class="form-control bg-gray-200 mb-1 h-8 rounded" #passwort="ngModel" [(ngModel)]="registrierungsUser.password"
             type="password"
             id="password"
             name="birthDate"
             placeholder="Passwort"
             required>
      <label for="wdhpassword">Passwort bestätigen<span class="text-red-600">*</span></label>
      <input class="form-control bg-gray-200 mb-1 h-8 rounded" #wdhpasswort="ngModel" [(ngModel)]="registrierungsUser.wdhpasswort"
             type="password"
             id="wdhpassword"
             name="wdhpasswort"
             placeholder="Passwort Bestätigen"
             required>
      <!--<label for="profilepicture">Profilbild</label>
      <input class="form-control bg-gray-200 mb-3 h-8 rounded" #profilepicture="ngModel" [(ngModel)]="registrierungsUser.profilePicture"
             type="file" (change)="onFileSelected($event)" accept="image/*"
             id="profilepicture"
             name="profilepicture">-->
      <label for="profilepicture">Profilbild</label>
      <input class="form-control bg-gray-200 mb-2 h-8 rounded"
             type="file" (change)="onFileSelected($event)" accept="image/*"
             id="profilepicture"
             name="profilepicture">



      <button [disabled]="registrierungsform.invalid" class="btn btn-info bg-[#914141] text-white hover:bg-[#733C3C] rounded h-8
              disabled:bg-gray-400 disabled:text-black disabled:cursor-not-allowed"
              type="submit">Submit
      </button>
      <div>
        <span class="text-red-600">*</span>
        <span>Pflichtfeld</span>
      </div>


    </form>
  </div>

</div>
