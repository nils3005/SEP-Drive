<div class="rideSettingsContainer">
  <p class="headline">Ride Simulation</p>
  <div class="dataContainer">
    <app-data-display [label]="'Start'" [data]="geoStoreService.start.getValue()?.properties?.label ?? ''"/>
    @for (stop of geoStoreService.stops.getValue(); track stop; let i = $index) {
      <app-data-display [label]="'Zwischenstopp ' + (i + 1)" [data]="stop.properties.label"/>
    }
    <app-data-display [label]="'Ziel'" [data]="geoStoreService.destination.getValue()?.properties?.label ?? ''"/>
    <app-data-display [label]="'Dauer'" [data]="(rideData.getValue()?.duration?.toString() ?? '') + ' min'"/>
    <app-data-display [label]="'Distanz'" [data]="(rideData.getValue()?.distance?.toString() ?? '') + ' km'"/>
    <app-data-display [label]="'Preis'" [data]="(rideData.getValue()?.price?.toString() ?? '') + ' €'"/>
  </div>
  <div class="sliderRow">
    <p>3 sek</p>
    <input
      type="range"
      class="slider"
      min="3"
      max="30"
      [value]="speedValue"
      (input)="onSpeedChange($event)"
      [style.--value.%]="getPercentage(speedValue, 3, 30)"
      (change)="onSpeedBlur()"
    >
    <p>30 sek</p>
  </div>
  <div class="buttonRow">
    @if (rideSimulationStore.started) {
      <div class="buttonContainer">
        <button [className]="rideSimulationStore.rideData.getValue().paused ? 'resumeBtn' : 'pauseBtn'" (click)="toggleRideStatus()">
          {{ rideSimulationStore.rideData.getValue().paused ? "Fortsetzen" : "Pausieren" }}
        </button>
      </div>
    } @else {
      <div class="buttonContainer">
        <button class="resumeBtn" (click)="toggleRideStatus()">
          Start
        </button>
      </div>
    }
  </div>
  @if (rideSimulationStore.rideData.getValue().paused) {
    @if (geoStoreService.stops.getValue().length > 0 || showStopInput) {
      <app-location-stop-input (onStopsChange)="onStopChange($event)"/>
    } @else {
      <div class="inputRow">
        <i class="fa-solid fa-plus" (click)="showStopInput = !showStopInput"></i>
      </div>
    }
    <app-location-input placeholder="Ziel" [location]="geoStoreService.destination.getValue()" (onLocationSelected)="onDestinationChange($event)" [usedInSimulation]="true"/>
  }
</div>
