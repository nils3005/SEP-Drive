<div *ngIf="isLoggedIn">

  <div class="mt-15 font-sans" xmlns="http://www.w3.org/1999/html">
    <div class="w-full flex justify-center">
      <input
        type="text"
        placeholder="Name"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        class="search-input border border-gray-500 px-4 py-2 w-[500px] rounded-xl"
      />
    </div>
    <table mat-table
           #sort="matSort"
           matSort
           matSortActive="id"
           matSortDirection="asc"
           matSortDisableClear
           (matSortChange)="announceSortChange($event)"
           [dataSource]="dataSource"
           class="mat-elevation-z8 !mt-5 ">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let leaderboard">{{ leaderboard.name }} ({{leaderboard.username}})</td>
      </ng-container>

      <ng-container matColumnDef="distance">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Gesamtdistanz in km</th>
        <td mat-cell *matCellDef="let leaderboard">{{ leaderboard.distance }}</td>
      </ng-container>

      <ng-container matColumnDef="money">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Einnahmen</th>
        <td mat-cell *matCellDef="let leaderboard">{{ leaderboard.money }}</td>
      </ng-container>

      <ng-container matColumnDef="NumberOfRides">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Anzahl Fahrten</th>
        <td mat-cell *matCellDef="let leaderboard">{{ leaderboard.numberOfRides }}</td>
      </ng-container>

      <ng-container matColumnDef="rating">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Bewertung</th>
        <td mat-cell *matCellDef="let leaderboard">
          <mat-icon class="rating-star" *ngFor="let star of getStars(leaderboard.rating)">{{ star }}</mat-icon>
        </td>

      </ng-container>

      <ng-container matColumnDef="driveTime">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Gefahrene Zeit</th>
        <td mat-cell *matCellDef="let leaderboard"> {{ leaderboard.driveTime }})</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="!bg-[#dbabab]"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>

</div>
