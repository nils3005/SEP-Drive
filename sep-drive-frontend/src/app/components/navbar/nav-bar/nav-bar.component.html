<nav>
    <div class="innerNavbar">
        <div id="innerNavbar-left">
            <ul class="navItems">
                <li>
                    <app-nav-logo class="appNavLogo"/>
                </li>

                <!-- Link zur Startseite -->
                <li>
                    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
                </li>

                <!-- Link zur Social-Seite -->
                @if (isLoggedIn$ | async) {
                    <li>
                        <a routerLink="/social" routerLinkActive="active">Social</a>
                    </li>
                }
            </ul>
        </div>
        <div id="innerNavbar-right">
            <ul class="navItems">
                <!-- Login-Link (nur wenn nicht eingeloggt) -->
                @if (!(isLoggedIn$ | async)){
                    <li>
                        <a routerLink="/login" routerLinkActive="active">Login</a>
                    </li>
                } @else {
                    <li>
                        <a routerLink="/logout" routerLinkActive="active" (click)="logout()">Logout</a>
                    </li>
                }

                @if (user$ | async; as user) {
                    <li>
                        <a
                                [routerLink]="['/social/user', user.id]"
                                routerLinkActive="active"
                                class="profile-link"
                        >
                            @if (user.profilePicture) {
                                <img
                                        [src]="'data:image/png;base64,' + user.profilePicture"
                                        alt="Profilbild"
                                        class="profile-img"
                                />
                            } @else {
                                <i class="fa fa-user"></i>
                            }
                        </a>
                    </li>
                }
            </ul>
        </div>
    </div>
</nav>
