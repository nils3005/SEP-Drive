<div class="main">
    <div class="title">
        Chat mit name
    </div>
    <div class="messages">
        @if (this.messages()) {
            @for (message of this.messages(); track message.id) {
                @if (message.senderId === this.authService.user()?.id) {
                    <!-- Message ist vom eingeloggten User also rechtsbündig -->
                    <div class="message-right">
                        {{ message.content }}
                    </div>
                } @else {
                    <!-- Message ist von anderem User also linksbündig -->
                    <div class="message-left">
                        {{ message.content }}
                    </div>
                }
            }
        } @else {
            <div class="notification">
                Der Chat ist leer
            </div>
        }

        <!-- Flexbox flexdirection column und wenn auth.user gleich message.sender ist, dann justify-content right, sonst left -->
    </div>
    <div class="input">
            <textarea
                    #chatInput
                    [(ngModel)]="newMessage"
                    placeholder="Nachricht schreiben..."
                    class="chat-textarea"
                    (keydown.enter)="sendMessageWrapper($event)"
            ></textarea>
            <button (click)="sendMessage(newMessage())">
                <i class="fa fa-paper-plane" aria-hidden="true"></i>
            </button>
    </div>
</div>
