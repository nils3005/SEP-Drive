<div class="offer-container">

<!-- Linke Hälfte: Tabelle mit den eingegangenen Angeboten -->
<div class="offer-left">
    <h3>Angebote für Fahranfrage {{ rideRequestId }}</h3>
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" class="mat-elevation-z4">

        <!-- Bewertung des Fahrers -->
        <ng-container matColumnDef="rating">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="rating"> Bewertung </th>
            <td mat-cell *matCellDef="let offer">
                @for (star of [1, 2, 3, 4, 5]; track star) {
                    <i [class]="averageClass(star, offer.rating)"></i>
                }
            </td>
        </ng-container>

        <!-- Gesamtanzahl Fahrten -->
        <ng-container matColumnDef="totalRides">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="totalRides"> Fahrten </th>
            <td mat-cell *matCellDef="let offer"> {{ offer.totalRides }} </td>
        </ng-container>

        <!-- Gesamtstrecke -->
        <ng-container matColumnDef="totalDistance">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="totalDistance"> Distanz (km) </th>
            <td mat-cell *matCellDef="let offer"> {{ offer.totalDistance | number:'1.1-1' }} </td>
        </ng-container>

        <!-- Buttons -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Aktion </th>
            <td mat-cell *matCellDef="let offer">
                <button mat-button color="primary" (click)="acceptOffer(offer.offerId)">
                    Annehmen
                </button>
                <button mat-button color="warn" (click)="rejectOffer(offer.offerId)">
                    Ablehnen
                </button>
            </td>
        </ng-container>

        <!-- Header- und Row-Definition -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row        *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <p *ngIf="dataSource?.data?.length === 0" class="no-offers-text">
        Keine Angebote vorhanden.
    </p>
</div>

<!-- TODO Map mit Route anzeigen und Summary mit entsprechenden Daten zur Route. Rechte Hälfte: RideRequest‐Summary + Map -->
<div class="offer-right">
    <!-- 1. Überschrift oder Info-Box -->
    <h3>Fahranfrage‐Details</h3>
    <!-- Map-Komponente (Leaflet‐Karte mit Route und Marker) -->
    <app-map class="map-component"></app-map>

    <!-- RideRequestSummary-Komponente (stellt Start, Ziel, Distanz etc. dar) -->
    <app-ride-request-summary></app-ride-request-summary>
</div>

</div>
