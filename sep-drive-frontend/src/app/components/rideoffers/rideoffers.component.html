<div>
    <h2>Angebote für Fahranfrage {{ rideRequestId }}</h2>

    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" class="mat-elevation-z8">

       <!-- Bewertung -->
        <ng-container matColumnDef="rating">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="rating"> Bewertung </th>
            <td mat-cell *matCellDef="let offer"> {{offer.rating | number:'1.1-2'}} </td>
        </ng-container>

        <!-- Gesamtanzahl Fahrten -->
        <ng-container matColumnDef="totalRides">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="totalRides"> Fahrten </th>
            <td mat-cell *matCellDef="let offer"> {{offer.totalRides}} </td>
        </ng-container>

        <!-- Gesamtstrecke -->
        <ng-container matColumnDef="totalDistance">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="totalDistance"> Distanz (km) </th>
            <td mat-cell *matCellDef="let offer"> {{offer.totalDistance | number:'1.0-1'}} </td>
        </ng-container>

        <!-- Aktionen -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Akzeptieren/Ablehnen </th>
            <td mat-cell *matCellDef="let offer">
                <button mat-button color="primary" (click)="acceptOffer(offer.offerId)">
                    Annehmen
                </button>
                <button mat-button color="warn" (click)="rejectOffer(offer.offerId)">
                    Ablehnen
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row        *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    @if (!dataSource || dataSource.data.length === 0) {
        <p>Keine Angebote vorhanden.</p>
    }
</div>
